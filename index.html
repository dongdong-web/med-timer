<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#eef2f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="吃药计时" />
<meta name="description" content="吃药计时：点一下记下一种，自动算间隔，结束看总计。" />
<title>吃药计时</title>
<style>
  :root{
    --bg-a:#eef2f9; --bg-b:#f8fafc; --glow-top:#e4ecfd;
    --fg:#0f141b; --muted:#78818f;
    --line:rgba(16,24,40,.09);
    --hairline:rgba(16,24,40,.06);
    --ring-track:rgba(16,24,40,.055);
    --accent-a:#4b7bff; --accent-b:#2f5bff;
    --ok-a:#22c48c; --ok-b:#0fa06f;
    --halo:rgba(47,91,255,.20);
    --halo-ok:rgba(15,160,111,.22);
    --surface:rgba(255,255,255,.70);
    --shadow:rgba(24,39,75,.10);
    --warn:#e5484d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg-a:#0a0d13; --bg-b:#111621; --glow-top:#18233c;
      --fg:#eaeef6; --muted:#8b93a3;
      --line:rgba(255,255,255,.09);
      --hairline:rgba(255,255,255,.07);
      --ring-track:rgba(255,255,255,.075);
      --accent-a:#6a93ff; --accent-b:#3f68ff;
      --ok-a:#2fd39a; --ok-b:#12b07a;
      --halo:rgba(70,110,255,.26);
      --halo-ok:rgba(30,200,140,.20);
      --surface:rgba(255,255,255,.045);
      --shadow:rgba(0,0,0,.45);
      --warn:#ff6369;
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(120% 78% at 50% -12%, var(--glow-top) 0%, transparent 62%),
      linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 58%, var(--bg-b) 100%);
    display:flex; align-items:center; justify-content:center;
    padding:30px 22px calc(30px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .app{ position:relative; width:100%; max-width:360px; text-align:center; touch-action:manipulation; }
  [hidden]{ display:none !important; }

  /* 提示音开关 */
  .sound{
    position:absolute; top:-8px; right:-8px; width:40px; height:40px;
    display:grid; place-items:center; border:0; border-radius:50%;
    background:transparent; color:var(--muted); cursor:pointer; opacity:.8;
    transition:opacity .2s ease, color .2s ease;
  }
  .sound:hover{ opacity:1; color:var(--fg); }
  .sound:active{ transform:scale(.94); }
  .sound svg{ width:19px; height:19px; display:block; }
  .sound .icon-off{ display:none; }
  .sound.muted{ opacity:.5; }
  .sound.muted .icon-on{ display:none; }
  .sound.muted .icon-off{ display:block; }

  .top{ font-size:12px; letter-spacing:.14em; color:var(--muted); text-indent:.14em; }
  .timer{
    margin-top:10px; font-size:clamp(52px,16vw,72px); line-height:1.02; font-weight:200;
    font-variant-numeric:tabular-nums; letter-spacing:-.01em;
  }
  .sub{ margin-top:8px; font-size:14px; color:var(--muted); min-height:20px; letter-spacing:.01em; }

  /* 圆盘 + 进度环 */
  .dial{ position:relative; width:194px; height:194px; margin:22px auto 0; display:grid; place-items:center; }
  .dial::before{
    content:""; position:absolute; inset:-14px; border-radius:50%; z-index:-1;
    background:radial-gradient(circle, var(--halo) 0%, transparent 68%);
    filter:blur(4px); transition:background .5s ease;
  }
  .dial.ready::before{ background:radial-gradient(circle, var(--halo-ok) 0%, transparent 68%); animation:breathe 2.6s ease-in-out infinite; }
  @keyframes breathe{ 0%,100%{ opacity:.7; transform:scale(.99); } 50%{ opacity:1; transform:scale(1.05); } }

  .ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); pointer-events:none; }
  .ring circle{ fill:none; stroke-width:3.5; stroke-linecap:round; }
  .ring-track{ stroke:var(--ring-track); }
  .ring-fill{
    stroke:var(--accent-b); stroke-dasharray:584.34; stroke-dashoffset:584.34;
    transition:stroke-dashoffset .4s linear, stroke .5s ease;
  }
  .dial.ready .ring-fill{ stroke:var(--ok-b); }

  .main{
    position:relative; z-index:2;
    width:168px; height:168px; border:0; border-radius:50%; padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    background:linear-gradient(160deg, var(--accent-a), var(--accent-b));
    color:#fff; cursor:pointer; font-family:inherit;
    box-shadow:0 20px 38px -14px rgba(47,91,255,.62), inset 0 1px 0 rgba(255,255,255,.28);
    transition:transform .14s ease, background .45s ease, box-shadow .45s ease;
  }
  .main:active{ transform:scale(.955); }
  .main .lbl{ font-size:29px; font-weight:600; letter-spacing:.1em; text-indent:.1em; }
  .main .aside{ font-size:12.5px; opacity:.85; letter-spacing:.04em; }
  .main.ready{
    background:linear-gradient(160deg, var(--ok-a), var(--ok-b));
    box-shadow:0 20px 38px -14px rgba(15,160,111,.62), inset 0 1px 0 rgba(255,255,255,.26);
  }

  .end{
    margin:18px auto 0; display:block; border:1px solid var(--line); background:var(--surface);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    color:var(--muted); font:inherit; font-size:13.5px; letter-spacing:.1em; text-indent:.1em;
    padding:10px 24px; border-radius:999px; cursor:pointer; box-shadow:0 1px 2px var(--shadow);
    transition:color .2s ease, border-color .2s ease, transform .12s ease;
  }
  .end:hover{ color:var(--fg); border-color:rgba(120,130,150,.35); }
  .end:active{ transform:scale(.98); }

  .foot{
    margin-top:20px; padding-top:16px; border-top:1px solid var(--hairline);
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; color:var(--muted);
  }
  .link{
    border:0; background:transparent; color:var(--muted); font:inherit; cursor:pointer;
    padding:8px 4px; border-radius:10px; letter-spacing:.02em; transition:color .2s ease;
  }
  .link:hover{ color:var(--fg); }
  .link:disabled{ opacity:.3; cursor:default; }
  .count{ font-variant-numeric:tabular-nums; letter-spacing:.02em; }

  /* 记录页 */
  .sum-title{ font-size:20px; font-weight:600; letter-spacing:.01em; }
  .sum-sub{ margin-top:8px; font-size:13px; color:var(--muted); }
  .list{
    list-style:none; margin:22px 0 0; padding:4px 16px; width:100%;
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    box-shadow:0 1px 2px var(--shadow);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  }
  .list li{
    display:grid; grid-template-columns:1fr auto 74px; gap:12px; align-items:baseline;
    padding:12px 0; border-bottom:1px solid var(--line); font-size:15px; text-align:left;
  }
  .list li:last-child{ border-bottom:0; }
  .idx{ color:var(--muted); font-size:13px; letter-spacing:.02em; }
  .at{ font-variant-numeric:tabular-nums; }
  .gap{ font-size:13px; color:var(--muted); text-align:right; font-variant-numeric:tabular-nums; }
  .gap.early{ color:var(--warn); }
  .again{
    margin-top:22px; width:100%; height:54px; border:0; border-radius:16px;
    background:linear-gradient(160deg, var(--accent-a), var(--accent-b)); color:#fff;
    font:inherit; font-size:16px; font-weight:600; letter-spacing:.12em; text-indent:.12em;
    cursor:pointer; box-shadow:0 16px 30px -16px rgba(47,91,255,.5);
    transition:transform .12s ease;
  }
  .again:active{ transform:scale(.985); }

  @media (max-height:640px){
    .dial{ width:172px; height:172px; margin-top:18px; }
    .main{ width:146px; height:146px; }
    .main .lbl{ font-size:25px; }
    .timer{ font-size:clamp(44px,13vw,60px); }
  }
</style>
</head>
<body>
<div class="app">

  <button class="sound" id="soundBtn" type="button" aria-pressed="true" aria-label="提示音开关" title="提示音开关">
    <svg class="icon-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5a1 1 0 0 0 1 1h2.4l3.7 3.1a.8.8 0 0 0 1.3-.6V6a.8.8 0 0 0-1.3-.6L7.4 8.5H5a1 1 0 0 0-1 1z"/>
      <path d="M16.2 8.8a4.4 4.4 0 0 1 0 6.4"/><path d="M18.8 6.2a8 8 0 0 1 0 11.6"/>
    </svg>
    <svg class="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9.5v5a1 1 0 0 0 1 1h2.4l3.7 3.1a.8.8 0 0 0 1.3-.6V6a.8.8 0 0 0-1.3-.6L7.4 8.5H5a1 1 0 0 0-1 1z"/>
      <path d="M16.5 9.5l5 5"/><path d="M21.5 9.5l-5 5"/>
    </svg>
  </button>

  <section id="screen">
    <div class="top" id="top">点一下开始</div>
    <div class="timer" id="timer">00:00</div>
    <div class="sub" id="sub" aria-live="polite">记下第一种药</div>

    <div class="dial" id="dial">
      <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle class="ring-track" cx="100" cy="100" r="93" />
        <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="93" />
      </svg>
      <button class="main" id="mainBtn" type="button">
        <span class="lbl" id="mainLbl">吃药</span>
        <span class="aside" id="mainAside">第 1 种</span>
      </button>
    </div>

    <button class="end" id="endBtn" type="button" hidden>结束这一轮</button>

    <div class="foot">
      <button class="link" id="intervalBtn" type="button">间隔 15 分钟</button>
      <span class="count" id="count">已吃 0 种</span>
      <button class="link" id="undoBtn" type="button">撤销</button>
    </div>
  </section>

  <section id="summary" hidden>
    <div class="sum-title">这一轮吃完了</div>
    <div class="sum-sub" id="sumSub"></div>
    <ol class="list" id="list"></ol>
    <button class="again" id="againBtn" type="button">再开一轮</button>
  </section>

</div>

<script>
(function () {
  'use strict';

  var KEY = 'med-timer-v2';
  var INTERVALS = [10, 15, 20];
  var TOLERANCE = 30 * 1000;          // 提前 30 秒内不追问，视为按时
  var RING = 2 * Math.PI * 93;        // 进度环周长

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    screen: $('screen'), top: $('top'), timer: $('timer'), sub: $('sub'),
    dial: $('dial'), ring: $('ringFill'),
    btn: $('mainBtn'), lbl: $('mainLbl'), aside: $('mainAside'), end: $('endBtn'),
    intervalBtn: $('intervalBtn'), count: $('count'), undo: $('undoBtn'),
    sound: $('soundBtn'),
    summary: $('summary'), sumSub: $('sumSub'), list: $('list'), again: $('againBtn')
  };

  function fresh() {
    return { doses: [], intervalMin: 15, sound: true, done: false, endedAt: null };
  }

  var s = load();
  var ticker = null;
  var wasReady = false;
  var soundOn = s.sound !== false;

  /* ---------- 提示音（WebAudio，无需音频文件） ---------- */

  var actx = null;

  function audio() {
    if (!soundOn) return null;
    if (actx) {
      if (actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
      return actx;
    }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = new AC(); } catch (e) { return null; }
    return actx;
  }

  function tone(freq, delay, dur, vol, type) {
    var c = audio();
    if (!c) return;
    try {
      var t0 = c.currentTime + delay;
      var o = c.createOscillator();
      var g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.03);
    } catch (e) {}
  }

  function chime() {                 // 到点：柔和两声，然后轻一点的高音
    tone(880, 0, 0.6, 0.13, 'sine');
    tone(1318.5, 0.17, 0.75, 0.11, 'sine');
    tone(1760, 0.34, 0.5, 0.05, 'sine');
  }

  function tickSound() { tone(1046.5, 0, 0.07, 0.035, 'triangle'); }

  function buzz(pattern) {
    if (!navigator.vibrate) return;
    try { navigator.vibrate(pattern); } catch (e) {}
  }

  /* ---------- 存取 ---------- */

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return fresh();
      var o = JSON.parse(raw);
      if (!o || !Array.isArray(o.doses)) return fresh();
      return {
        doses: o.doses.filter(function (t) { return typeof t === 'number'; }),
        intervalMin: INTERVALS.indexOf(o.intervalMin) >= 0 ? o.intervalMin : 15,
        sound: o.sound !== false,
        done: !!o.done,
        endedAt: typeof o.endedAt === 'number' ? o.endedAt : null
      };
    } catch (e) { return fresh(); }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }

  /* ---------- 时间格式 ---------- */

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function fmtDur(ms) {
    var t = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
    return h ? h + ':' + pad2(m) + ':' + pad2(sec) : pad2(m) + ':' + pad2(sec);
  }

  function fmtLeft(ms) {
    var t = Math.max(0, Math.ceil(ms / 1000));
    var m = Math.floor(t / 60), sec = t % 60;
    if (m && sec) return m + ' 分 ' + sec + ' 秒';
    if (m) return m + ' 分钟';
    return sec + ' 秒';
  }

  function fmtLong(ms) {
    var t = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(t / 3600); t -= h * 3600;
    var m = Math.floor(t / 60); var sec = t - m * 60;
    var out = [];
    if (h) out.push(h + ' 小时');
    if (m) out.push(m + ' 分');
    if (!h && sec) out.push(sec + ' 秒');
    return out.length ? out.join(' ') : '0 秒';
  }

  function clockOf(ts) {
    var d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  /* ---------- 渲染 ---------- */

  function setRing(p) {
    var v = RING * (1 - Math.max(0, Math.min(1, p)));
    el.ring.style.strokeDashoffset = v.toFixed(1);
  }

  function renderSound() {
    if (soundOn) {
      el.sound.classList.remove('muted');
      el.sound.setAttribute('aria-pressed', 'true');
    } else {
      el.sound.classList.add('muted');
      el.sound.setAttribute('aria-pressed', 'false');
    }
  }

  function render() {
    if (s.done) { renderSummary(); return; }
    el.summary.hidden = true;
    el.screen.hidden = false;

    var now = Date.now();
    var n = s.doses.length;
    var need = s.intervalMin * 60000;

    el.intervalBtn.textContent = '间隔 ' + s.intervalMin + ' 分钟';
    el.undo.disabled = n === 0;
    el.end.hidden = n === 0;
    el.btn.classList.remove('ready');
    el.dial.classList.remove('ready');
    renderSound();

    if (n === 0) {
      wasReady = false;
      el.top.textContent = '点一下开始';
      el.timer.textContent = '00:00';
      el.sub.textContent = '记下第一种药';
      el.lbl.textContent = '吃药';
      el.aside.textContent = '第 1 种';
      el.count.textContent = '已吃 0 种';
      setRing(0);
      document.title = '吃药计时';
      return;
    }

    var sinceLast = now - s.doses[n - 1];
    el.top.textContent = '距上次吃药';
    el.timer.textContent = fmtDur(sinceLast);
    el.lbl.textContent = '吃药';
    el.aside.textContent = '第 ' + (n + 1) + ' 种';
    el.count.textContent = '已吃 ' + n + ' 种 · ' + fmtDur(now - s.doses[0]);
    setRing(sinceLast / need);

    var left = need - sinceLast;
    if (left > 0) {
      wasReady = false;
      el.sub.textContent = '还要等 ' + fmtLeft(left);
      document.title = '吃药计时 · 等 ' + fmtLeft(left);
    } else {
      if (!wasReady) { chime(); buzz([28, 70, 28]); }   // 到点：响一下 + 轻振
      wasReady = true;
      el.sub.textContent = '间隔到了，可以吃下一种';
      el.btn.classList.add('ready');
      el.dial.classList.add('ready');
      document.title = '可以吃药了';
    }
  }

  function renderSummary() {
    el.screen.hidden = true;
    el.summary.hidden = false;
    document.title = '吃药计时 · 已完成';

    var end = s.endedAt || s.doses[s.doses.length - 1];
    var first = new Date(s.doses[0]);
    var today = new Date(Date.now());
    var isToday = first.getFullYear() === today.getFullYear() &&
                  first.getMonth() === today.getMonth() &&
                  first.getDate() === today.getDate();

    el.sumSub.textContent = '共 ' + s.doses.length + ' 种 · 历时 ' + fmtLong(end - s.doses[0]) +
                            (isToday ? '' : ' · ' + (first.getMonth() + 1) + '月' + first.getDate() + '日');

    var need = s.intervalMin * 60000;
    var html = '';
    for (var i = 0; i < s.doses.length; i++) {
      var t = s.doses[i];
      var gapHtml = '<span class="gap">开始</span>';
      if (i > 0) {
        var gap = t - s.doses[i - 1];
        var early = gap < need - TOLERANCE;
        gapHtml = '<span class="gap' + (early ? ' early' : '') + '">' +
                  (early ? '⚠ ' : '') + '+' + fmtDur(gap) + '</span>';
      }
      html += '<li><span class="idx">第 ' + (i + 1) + ' 种</span>' +
              '<span class="at">' + clockOf(t) + '</span>' + gapHtml + '</li>';
    }
    el.list.innerHTML = html;
  }

  /* ---------- 计时器 ---------- */

  function startTicker() {
    stopTicker();
    ticker = setInterval(render, 250);
  }
  function stopTicker() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }
  function sync() {
    if (s.done) stopTicker(); else startTicker();
    render();
  }

  /* ---------- 交互 ---------- */

  el.btn.addEventListener('click', function () {
    var n = s.doses.length;

    // 手滑连点：1.5 秒内的第二下忽略
    if (n > 0 && Date.now() - s.doses[n - 1] < 1500) return;

    if (n > 0) {
      var gap = Date.now() - s.doses[n - 1];
      var need = s.intervalMin * 60000;
      if (need - gap > TOLERANCE) {
        var ok = window.confirm('还没到 ' + s.intervalMin + ' 分钟（才等了 ' +
                                fmtLeft(gap) + '）。\n仍然记下第 ' + (n + 1) + ' 种药吗？');
        if (!ok) return;
      }
    }

    tickSound(); buzz(10);
    s.doses.push(Date.now());
    save(); render();
  });

  el.end.addEventListener('click', function () {
    if (!s.doses.length) return;
    tickSound();
    s.done = true;
    s.endedAt = Date.now();
    save(); stopTicker(); render();
    window.scrollTo(0, 0);
  });

  el.undo.addEventListener('click', function () {
    if (s.done || !s.doses.length) return;
    s.doses.pop();
    save(); render();
  });

  el.intervalBtn.addEventListener('click', function () {
    var i = INTERVALS.indexOf(s.intervalMin);
    s.intervalMin = INTERVALS[(i + 1) % INTERVALS.length];
    tickSound();
    save(); render();
  });

  el.sound.addEventListener('click', function () {
    soundOn = !soundOn;
    s.sound = soundOn;
    save(); renderSound();
    if (soundOn) chime();
  });

  el.again.addEventListener('click', function () {
    var keep = s.intervalMin, keepSound = s.sound;
    s = fresh();
    s.intervalMin = keep;
    s.sound = keepSound;
    soundOn = s.sound !== false;
    save(); sync();
  });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) sync();
  });
  window.addEventListener('focus', sync);

  sync();

  // 手机从后台切回来、或另开一个标签时保持一致
  window.addEventListener('storage', function (e) {
    if (e.key !== KEY) return;
    s = load(); soundOn = s.sound !== false; sync();
  });
})();
</script>
</body>
</html>
